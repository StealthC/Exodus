name: Build Exodus

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-x64:
    name: Release x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Verify vendored third-party source layout
        shell: pwsh
        run: |
          $requiredFiles = @(
            'Third\zlib\zlib-1.2.8\adler32.c',
            'Third\libjpeg\jpeg-9a\jaricom.c',
            'Third\libpng\lpng1612\png.c',
            'Third\libtiff\tiff-4.0.9\libtiff\tif_aux.c',
            'Third\expat\expat-2.1.0\lib\xmlparse.c'
          )
          $missing = $requiredFiles | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Missing vendored third-party sources: $($missing -join ', ')" }

      - name: Locate MSBuild
        id: msbuild
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild was not found on the runner.' }
          "path=$msbuild" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build third-party libraries
        shell: pwsh
        run: |
          & '${{ steps.msbuild.outputs.path }}' ThirdPartyLibraries.sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /nologo /verbosity:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Build Exodus
        shell: pwsh
        run: |
          & '${{ steps.msbuild.outputs.path }}' Exodus.sln /m /t:Build /p:Configuration=Release /p:Platform=x64 /nologo /verbosity:minimal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Verify expected outputs
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $requiredAfterBuild = @(
            "$root\Exodus.exe",
            "$root\System.dll",
            "$root\Assemblies\M68000.dll",
            "$root\Assemblies\Z80.dll"
          )
          $missing = $requiredAfterBuild | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Build did not produce expected output: $($missing -join ', ')" }

      - name: Assemble release layout
        shell: pwsh
        run: |
          $root = $env:GITHUB_WORKSPACE
          $stage = "$root\dist\Exodus"
          $dirs = 'Plugins', 'Modules', 'Workspaces', 'Captures', 'PersistentState', 'Savestates'
          foreach ($d in $dirs) { $null = New-Item -ItemType Directory -Force "$stage\$d" }

          Copy-Item "$root\Exodus.exe" $stage
          Copy-Item "$root\System.dll" $stage
          Copy-Item "$root\License.txt" $stage
          Copy-Item "$root\ReleaseNotes.txt" $stage
          Copy-Item "$root\Packaging\ReleaseSettings.xml" "$stage\settings.xml"

          # Device/extension DLLs ship under Plugins\; the MCP plugin does not
          # belong to this fork's release.
          Copy-Item "$root\Assemblies\*.dll" "$stage\Plugins\"
          Copy-Item "$root\Data\Modules\*.xml" "$stage\Modules\"
          Copy-Item "$root\Data\Workspaces\*.xml" "$stage\Workspaces\"

          $required = @(
            "$stage\Exodus.exe",
            "$stage\System.dll",
            "$stage\settings.xml",
            "$stage\Plugins\M68000.dll",
            "$stage\Modules\Sega Mega Drive 1600.xml",
            "$stage\Workspaces\Mega Drive Clean.xml"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) { throw "Release staging is incomplete: $($missing -join ', ')" }

      # GitHub zips the folder into a single download; no separate archive.
      - uses: actions/upload-artifact@v6
        with:
          name: exodus-release-x64
          if-no-files-found: error
          path: dist/Exodus
